# 프로토타입을 깃허브 페이지로 올린다.
#
# 서버가 없으므로 Next를 정적 파일로 내보내고(`GITHUB_PAGES=true`),
# 데이터는 브라우저에서 MSW 목업이 만들어 낸다.
# 저장소 이름이 주소에 끼어들기 때문에(`/festival`) 경로 접두사를 빌드에 넣어 준다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 수동으로도 다시 올릴 수 있게 열어 둔다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새로 밀어 넣으면 진행 중인 것은 끝까지 두고 대기 중인 것만 버린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 검사 (타입 · 린트)
        run: npx tsc --noEmit && npx eslint src

      - name: 정적 빌드
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /festival
          NEXT_PUBLIC_API_MOCKING: enabled
        run: npm run build

      # 깃허브 페이지가 `_next` 폴더를 Jekyll 찌꺼기로 보고 지우지 않게 한다.
      - name: .nojekyll 넣기
        run: touch out/.nojekyll

      # 저장소 설정에서 페이지가 꺼져 있으면 켜 준다. (이미 켜져 있으면 아무 일도 없다)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
